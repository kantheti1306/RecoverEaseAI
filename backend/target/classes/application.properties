# ===== Active Profile =====
# Set SPRING_PROFILES_ACTIVE=prod in Render env vars for production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ===== Server =====
server.port=${PORT:8080}

# ===== H2 In-Memory Database (local dev only) =====
spring.datasource.url=jdbc:h2:mem:recoverease;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:RecoverEaseAISecretKey2025SuperSecureHackathonJWTToken}
jwt.expiration=86400000

# ===== Google Gemini API =====
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ===== CORS =====
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===== Logging =====
logging.level.com.recoverease=INFO
logging.level.org.springframework.security=WARN
