services:
  # ===== Spring Boot Backend =====
  - type: web
    name: recoverease-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: recoverease-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/auth/health

  # ===== PostgreSQL Database =====
databases:
  - name: recoverease-db
    plan: free
    databaseName: recoverease
    user: recoverease_user
